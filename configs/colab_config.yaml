# Colab — sketch → 3D (Gaussian scaffold): narrow synthetic rigid shapes (box/sphere/cylinder).
# data_root holds sketch/ + rgb/ + manifest.jsonl from scripts/gen_sketch3d_synthetic.py

data_root: "/content/2d-to-3d/data/sketch3d_train"
dataset_archive: ""
dataset_gdrive_id: ""
dataset_download_url: ""
dataset_drive_zip: ""
download_cache_dir: "/content/data/_download_cache"
checkpoint_dir: "/content/drive/MyDrive/3DGS_Checkpoints"

# Auto-run generator if manifest missing or too small (first Colab run).
gen_sketch_if_missing: true
sketch_num_samples: 800

batch_size: 8
num_workers: 2
image_size: 128
patch_size: 16
num_gaussians: 2048
encoder_dim: 256
encoder_depth: 4

epochs: 3
lr: 3.0e-4
weight_decay: 0.01
checkpoint_every_n_steps: 150
log_every_n_steps: 20

ssim_lambda: 0.2
amp_dtype: bfloat16
seed: 42

# Optional Objaverse GLBs (slow); off by default for fast sketch pipeline.
objaverse_download: false
objaverse_out_dir: "/content/data/objaverse_vehicles"
objaverse_cache: "/content/data/.objaverse_cache"
objaverse_max_objects: 50
objaverse_mode: lvis
objaverse_scan_uids: 50000
objaverse_processes: 2
