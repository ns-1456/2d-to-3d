# Local / CI smoke test — avoids writing to /content/drive.
data_root: "./data/shapenet_vehicle"
checkpoint_dir: "./artifacts/checkpoints"
dataset_archive: ""
dataset_gdrive_id: ""
dataset_download_url: ""
dataset_drive_zip: ""
download_cache_dir: "./data/_download_cache"
batch_size: 2
num_workers: 0
image_size: 256
patch_size: 32
num_gaussians: 512
encoder_dim: 256
encoder_depth: 2
epochs: 1
lr: 3.0e-4
weight_decay: 0.01
checkpoint_every_n_steps: 50
log_every_n_steps: 5
ssim_lambda: 0.2
amp_dtype: bfloat16
seed: 42
synthetic: true

objaverse_download: false
objaverse_out_dir: "./data/objaverse_vehicles"
objaverse_cache: "./data/.objaverse_cache"
objaverse_max_objects: 5
objaverse_mode: lvis
objaverse_scan_uids: 5000
objaverse_processes: 1
